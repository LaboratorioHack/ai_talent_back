# Production stack on EC2 (~/ai-talent). Secrets live in ~/ai-talent/.env (never in git).
# DB = Supabase (managed), so there is no database container here.
#
# OWASP A02: containers run as non-root (see Dockerfiles), with no extra Linux capabilities,
# no privilege escalation and read-only root filesystems. Only Caddy publishes ports.

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # No depends_on: web and api are deployed by different repos (each can only pull its own
    # GHCR image). Caddy returns 502 for a backend until that backend is up.

  web:
    <<: *hardening
    image: ghcr.io/laboratoriohack/ai-talent-web:latest
    tmpfs: ["/tmp", "/app/.next/cache:uid=1000,gid=1000"]   # Next.js cache needs a writable dir
    expose: ["3000"]

  api:
    <<: *hardening
    image: ghcr.io/laboratoriohack/ai-talent-api:latest
    # Each service only receives the secrets it needs (least privilege).
    environment:
      ASPNETCORE_URLS: http://+:8080
      SUPABASE_URL: ${SUPABASE_URL}
      ConnectionStrings__Supabase: ${API_DB_CONNECTION_STRING}
      AiEngine__BaseUrl: http://engine:8000/
      AiEngine__ApiKey: ${ENGINE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      R2__StorageBackend: ${STORAGE_BACKEND}
      R2__AccountId: ${R2_ACCOUNT_ID}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY}
      R2__BucketName: ${R2_BUCKET_NAME}
      R2__EndpointUrl: ${R2_ENDPOINT_URL}
    expose: ["8080"]
    depends_on: [engine]

  engine:
    <<: *hardening
    image: ghcr.io/laboratoriohack/ai-talent-engine:latest
    environment:
      ENVIRONMENT: production
      ENGINE_API_KEY: ${ENGINE_API_KEY}
      DATABASE_URL: ${ENGINE_DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STORAGE_BACKEND: ${STORAGE_BACKEND}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      EMBEDDINGS_DIMENSIONS: ${EMBEDDINGS_DIMENSIONS}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL}
      EMBEDDINGS_MODEL_FALLBACK: ${EMBEDDINGS_MODEL_FALLBACK}
    expose: ["8000"]   # internal only: reachable from api, not from internet

volumes:
  caddy_data:
  caddy_config:
