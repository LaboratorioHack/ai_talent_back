[project]
name = "ai-engine"
version = "0.1.0"
description = "AI Talent Scout - CV ingestion, anonymization, RAG and evaluation agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-anthropic>=1.0.0b261106",
    "agent-framework-core>=1.25.0",
    "anthropic>=1.17.0",
    "fastapi>=0.162.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
