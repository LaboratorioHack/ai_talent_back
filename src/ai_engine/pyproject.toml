[project]
name = "ai-engine"
version = "0.1.0"
description = "AI Talent Scout - CV ingestion, anonymization, RAG and evaluation agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-anthropic>=1.0.0b261112",
    "agent-framework-core>=1.26.0",
    "anthropic>=2.8.0",
    "boto3>=1.44.3",
    "openai>=3.51.0",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "kagglehub>=0.3.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "scalar-fastapi>=1.9.3",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
seed-resumes = "ai_engine.seeding.kaggle_seeder:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
