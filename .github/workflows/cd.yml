# CD = package + deploy. Runs ONLY on push to main (i.e. after a PR merge).
# Does NOT re-run lint/tests: those already gated the PR (branch protection requires `ci-ok`).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/laboratoriohack/ai-talent

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
      engine: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.engine == 'true' }}
      db: ${{ steps.filter.outputs.db == 'true' }}
      deploy: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.deploy == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/api/**'
            engine:
              - 'src/ai_engine/**'
            db:
              - 'supabase/migrations/**'
            deploy:
              - 'deploy/**'

  migrate:
    name: Supabase migrations
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
      - run: supabase db push

  build:
    name: Build ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: src/api
          - service: engine
            context: src/ai_engine
    steps:
      - name: Skip if unchanged
        id: gate
        run: echo "run=${{ needs.changes.outputs[matrix.service] }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'
      - uses: docker/login-action@v3
        if: steps.gate.outputs.run == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.run == 'true'
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to EC2
    needs: [changes, migrate, build]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true' || needs.changes.outputs.deploy == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + Caddyfile
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: /opt/ai-talent
          strip_components: 1

      - name: Pull & restart changed services
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVICES: >-
            ${{ needs.changes.outputs.api == 'true' && 'api' || '' }}
            ${{ needs.changes.outputs.engine == 'true' && 'engine' || '' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SERVICES
          script: |
            set -e
            cd /opt/ai-talent
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            if [ -n "$(echo $SERVICES | xargs)" ]; then docker compose pull $SERVICES; fi
            docker compose up -d --remove-orphans $SERVICES caddy
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
            docker image prune -f
