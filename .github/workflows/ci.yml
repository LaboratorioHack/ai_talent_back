# CI = quality + security gate. Runs ONLY on pull requests (lint, tests, build, dependency audit).
# Never builds images or deploys: that is CD's job (push to main).
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR files through the GitHub API
    outputs:
      api: ${{ steps.filter.outputs.api }}
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/api/**'
            engine:
              - 'src/ai_engine/**'

  api:
    name: API (.NET 10)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # NuGetAudit (Directory.Build.props) makes restore fail on vulnerable packages (OWASP A03).
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

  engine:
    name: AI Engine (Python)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ai_engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Dependency audit (OWASP A03)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit -r "$RUNNER_TEMP/req.txt" --no-deps --disable-pip --progress-spinner off

  # Flags new vulnerable dependencies / incompatible licenses introduced by the PR.
  # Needs GitHub Advanced Security on private repos -> only runs when the repo is public.
  dependency-review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Single required status check for branch protection.
  # `changes` must succeed (if it fails, api/engine are skipped and would look "green").
  # The other jobs may be skipped (unchanged service / private repo) but never fail.
  ci-ok:
    if: always()
    needs: [changes, api, engine, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes=$CHANGES | all=$RESULTS"
          if [[ "$CHANGES" != "success" ]]; then
            echo "::error::Job 'changes' did not succeed"; exit 1
          fi
          for r in $RESULTS; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::A required job ended with '$r'"; exit 1
            fi
          done
